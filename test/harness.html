<!doctype html><meta charset=utf-8><title>translator harness</title><pre id=out>running…</pre>
<script>
// Runs the built translators against fixtures with mocks of Zotero's translator API.
const WL = 'translators/Westlaw (legal).js', LX = 'translators/Lexis+ (legal).js';
const ZU = { capitalizeTitle: s => s.replace(/\b[a-z]+/g, (w, i) => i > 0 && /^(and|of|the|a|an|in|on|for|to|or|v)$/.test(w) ? w : w[0].toUpperCase() + w.slice(1)),
  cleanAuthor: a => { const p = a.split(' '); return { firstName: p.slice(0, -1).join(' '), lastName: p.slice(-1)[0], creatorType: 'author' }; } };
async function load(path) {
  const src = await (await fetch('../' + path, { cache: 'no-store' })).text();
  const body = src.slice(src.indexOf('\n}\n') + 3); // after the JSON header
  const items = [], picks = [];
  const Zotero = { debug() {}, Item: class { constructor(t) { this.itemType = t; this.creators = []; this.tags = []; this.notes = []; } complete() { items.push(this); } },
    selectItems: async (o) => { picks.push(Object.keys(o).length); return o; } };
  const doc = async (name) => new DOMParser().parseFromString(await (await fetch('../fixtures/' + name, { cache: 'no-store' })).text(), 'text/html');
  const requestDocument = async (u) => doc(/westlaw\.com/.test(u) ? 'westlaw-case.html' : u.split('/').pop());
  const T = new Function('Zotero', 'ZU', 'requestDocument', body + ';return { detectWeb, doWeb };')(Zotero, ZU, requestDocument);
  return { T, items, picks, doc };
}
const errors = [];
const eq = (a, b, m) => { if (JSON.stringify(a) !== JSON.stringify(b)) errors.push(m + ': got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b)); };
const pick = (o, ks) => Object.fromEntries(ks.map(k => [k, o[k]]));
(async () => {
  // header sanity: the target regex matches what it should
  for (const [p, yes, no] of [[WL, 'https://1.next.westlaw.com/Document/I92e66d600d2211f1b2dac9cbea775483/View/FullText.html', 'https://example.com/westlaw.com'], [LX, 'https://plus.lexis.com/api/document?x=1', 'https://www.lexisnexis.com/']]) {
    const h = JSON.parse((await (await fetch('../' + p, { cache: 'no-store' })).text()).split('\n}\n')[0] + '\n}');
    if (!new RegExp(h.target).test(yes)) errors.push(p + ': target misses ' + yes);
    if (new RegExp(h.target).test(no)) errors.push(p + ': target matches ' + no);
  }
  let w = await load(WL);
  const D = 'https://1.next.westlaw.com/Document/I92e66d600d2211f1b2dac9cbea775483/View/FullText.html?transitionType=x&contextData=(sc.Search)';
  eq(w.T.detectWeb(await w.doc('westlaw-case.html'), D), 'case', 'WL case detect');
  await w.T.doWeb(await w.doc('westlaw-case.html'), D);
  eq(pick(w.items[0], ['itemType', 'caseName', 'reporter', 'reporterVolume', 'firstPage', 'court', 'dateDecided', 'docketNumber', 'url', 'libraryCatalog']),
    { itemType: 'case', caseName: 'Feist Publications, Inc. v. Rural Telephone Service Co., Inc.', reporter: 'U.S.', reporterVolume: '499', firstPage: '340', court: 'U.S.', dateDecided: 'March 27, 1991', docketNumber: 'No. 89-1909', url: 'https://1.next.westlaw.com/Document/I92e66d600d2211f1b2dac9cbea775483/View/FullText.html', libraryCatalog: 'Westlaw' }, 'WL case item');
  await w.T.doWeb(await w.doc('westlaw-case-notitle.html'), D);
  eq(pick(w.items[1], ['reporter', 'reporterVolume', 'firstPage', 'court', 'dateDecided', 'docketNumber']), { reporter: 'WL', reporterVolume: '2025', firstPage: '458520', court: 'D. Del.', dateDecided: 'February 11, 2025', docketNumber: 'Civil Action No. 1:20-cv-613-SB' }, 'WL unpublished, header only');
  eq(w.T.detectWeb(await w.doc('westlaw-statute.html'), 'https://1.next.westlaw.com/Document/N2A5B4C6D7E8F9A0B1C2D3E4F5A6B7C8D/View/FullText.html?x=1'), 'statute', 'WL statute (N... document id)'); await w.T.doWeb(await w.doc('westlaw-statute.html'), D);
  eq(pick(w.items[2], ['code', 'codeNumber', 'section', 'nameOfAct']), { code: 'U.S.C.', codeNumber: '47', section: '230', nameOfAct: 'Protection for private blocking and screening of offensive material' }, 'WL federal statute item');
  await w.T.doWeb(await w.doc('westlaw-statute-state.html'), D);
  eq(pick(w.items[3], ['code', 'codeNumber', 'section', 'nameOfAct']), { code: 'N.Y. Civ. Rights Law', codeNumber: '', section: '50-f', nameOfAct: 'Right of publicity' }, 'WL state statute item');
  eq(w.T.detectWeb(await w.doc('westlaw-article.html'), D), 'journalArticle', 'WL article'); await w.T.doWeb(await w.doc('westlaw-article.html'), D);
  eq(pick(w.items[4], ['title', 'publicationTitle', 'journalAbbreviation', 'volume', 'pages', 'date']), { title: 'Code and Other Laws of Cyberspace', publicationTitle: 'Harvard Law Review', journalAbbreviation: 'Harv. L. Rev.', volume: '113', pages: '501', date: 'April 2000' }, 'WL article item');
  eq(w.items[4].creators.map(c => c.firstName + '|' + c.lastName), ['Lawrence|Lessig'], 'WL article author');
  eq(w.T.detectWeb(await w.doc('other.html'), D), false, 'WL other document page');
  eq(w.T.detectWeb(await w.doc('other.html'), 'https://1.next.westlaw.com/Home.html'), false, 'WL home');
  const L = 'https://1.next.westlaw.com/Search/Results.html?query=x';
  eq(w.T.detectWeb(await w.doc('westlaw-list.html'), L), 'multiple', 'WL list');
  eq(w.T.detectWeb(await w.doc('westlaw-list.html'), D), false, 'a document URL is never a list');
  // Lexis
  let x = await load(LX);
  const LU = 'https://plus.lexis.com/api/document?pdmfid=1&crid=abc';
  eq(x.T.detectWeb(await x.doc('lexis-case.html'), LU), 'case', 'LX case'); await x.T.doWeb(await x.doc('lexis-case.html'), LU);
  eq(pick(x.items[0], ['caseName', 'reporter', 'reporterVolume', 'firstPage', 'court', 'dateDecided', 'docketNumber', 'url', 'libraryCatalog']),
    { caseName: "Feist Publ'ns, Inc. v. Rural Tel. Serv. Co.", reporter: 'U.S.', reporterVolume: '499', firstPage: '340', court: 'U.S.', dateDecided: 'March 27, 1991', docketNumber: 'No. 89-1909', url: undefined, libraryCatalog: 'Lexis+' }, 'LX case item');
  eq(x.T.detectWeb(await x.doc('lexis-statute.html'), LU), 'statute', 'LX statute'); await x.T.doWeb(await x.doc('lexis-statute.html'), LU);
  eq(pick(x.items[1], ['code', 'codeNumber', 'section']), { code: 'U.S.C.', codeNumber: '47', section: '230' }, 'LX statute item');
  eq(x.T.detectWeb(await x.doc('lexis-results.html'), LU), 'multiple', 'LX results');
  await x.T.doWeb(await x.doc('lexis-results.html'), LU);
  eq([x.picks, x.items.length], [[2], 4], 'LX multiple: both selected and scraped');
  await w.T.doWeb(await w.doc('westlaw-list.html'), L).catch(e => errors.push('WL list scrape: ' + e.message));
  eq(w.picks, [2], 'WL list: duplicates and snippet links collapsed');
  // Real saved Westlaw pages (kept out of git: test pages/); skipped when absent
  const RP = { article: 'MARKS, MORALS, AND MARKETS _ Secondary Sources _ National _ Westlaw Advantage', case: 'Fletcher v. Experian Information Solutions, Incorporated _ Cases _ Texas _ Westlaw Advantage', statute: '§ 50-f. Right of publicity _ Statutes _ New York _ Westlaw Advantage', list: 'Search Results _ ai hallucination _ Westlaw Advantage' };
  const rp = async k => { const r = await fetch('../test pages/' + encodeURIComponent(RP[k] + (k === 'article' ? '.htm' : '.html')), { cache: 'no-store' }); return r.ok ? new DOMParser().parseFromString(await r.text(), 'text/html') : null; };
  let real = 'real pages: skipped', rc = await rp('case');
  if (rc) {
    const RW = await load(WL), u = 'https://1.next.westlaw.com/Document/I92e66d600d2211f1b2dac9cbea775483/View/FullText.html?listSource=Search';
    eq(RW.T.detectWeb(rc, u), 'case', 'real case detect'); await RW.T.doWeb(rc, u);
    eq(pick(RW.items[0], ['caseName', 'reporter', 'reporterVolume', 'firstPage', 'court', 'dateDecided', 'docketNumber', 'url']),
      { caseName: 'Fletcher v. Experian Information Solutions, Incorporated', reporter: 'F.4th', reporterVolume: '168', firstPage: '231', court: '5th Cir.', dateDecided: 'February 18, 2026', docketNumber: 'No. 25-20086', url: 'https://1.next.westlaw.com/Document/I92e66d600d2211f1b2dac9cbea775483/View/FullText.html' }, 'real case item');
    const rs = await rp('statute');
    eq(RW.T.detectWeb(rs, 'https://1.next.westlaw.com/Document/N3CE4D4E2D75F11F0AB4D95D7E6BE7963/View/FullText.html'), 'statute', 'real statute detect');
    await RW.T.doWeb(rs, 'https://1.next.westlaw.com/Document/N3CE4D4E2D75F11F0AB4D95D7E6BE7963/View/FullText.html');
    eq(pick(RW.items[1], ['itemType', 'code', 'codeNumber', 'section', 'nameOfAct']), { itemType: 'statute', code: 'N.Y. Civ. Rights Law', codeNumber: '', section: '50-f', nameOfAct: 'Right of publicity' }, 'real statute item');
    const ra = await rp('article'), au = 'https://1.next.westlaw.com/Document/If9416b51b20911e28578f7ccc38dcbee/View/FullText.html';
    if (ra) {
      eq(RW.T.detectWeb(ra, au), 'journalArticle', 'real article detect'); await RW.T.doWeb(ra, au);
      eq(pick(RW.items[2], ['itemType', 'title', 'publicationTitle', 'journalAbbreviation', 'volume', 'pages', 'date']), { itemType: 'journalArticle', title: 'Marks, Morals, and Markets', publicationTitle: 'Stanford Law Review', journalAbbreviation: 'Stan. L. Rev.', volume: '65', pages: '761', date: 'April 2013' }, 'real article item');
      eq(RW.items[2].creators.map(c => c.firstName + '|' + c.lastName), ['Jeremy N.|Sheff'], 'real article author');
    }
    const rl = await rp('list'), lu = 'https://1.next.westlaw.com/Search/Results.html?query=ai%20hallucination&jurisdiction=ALLCASES';
    eq(RW.T.detectWeb(rl, lu), 'multiple', 'real list detect'); await RW.T.doWeb(rl, lu);
    const n = RW.picks[0];
    if (n !== 100) errors.push('real list: only ' + n + ' results found'); 
    real = 'real pages: case, statute, list (' + n + ' results)';
  }
  // Real saved Lexis+ pages
  const RL = { case: 'lexis-case.raw', usc: 'lexis-statute-1127.raw', statute: 'TENNESSEE CODE UNANNOTATED CUI_ PAW Document Page', list: '48 results for AI hallucinations' };
  const rlp = async k => { const r = await fetch('../test pages/' + encodeURIComponent(RL[k] + (/raw/.test(RL[k]) ? '.html' : '.html')), { cache: 'no-store' }); return r.ok ? new DOMParser().parseFromString(await r.text(), 'text/html') : null; };
  const ls = await rlp('statute');
  if (ls) {
    const RX = await load(LX), u = 'https://plus.lexis.com/document/?pdmfid=1&crid=x';
    eq(RX.T.detectWeb(ls, u), 'statute', 'real Lexis statute detect'); await RX.T.doWeb(ls, u);
    eq(pick(RX.items[0], ['itemType', 'code', 'codeNumber', 'section', 'nameOfAct', 'libraryCatalog']), { itemType: 'statute', code: 'Tenn. Code Ann.', codeNumber: '', section: '47-25-1102', nameOfAct: 'Part definitions', libraryCatalog: 'Lexis+' }, 'real Lexis statute item');
    const lc = await rlp('case'), lusc = await rlp('usc');
    if (lc) {
      eq(RX.T.detectWeb(lc, u), 'case', 'real Lexis case detect'); await RX.T.doWeb(lc, u);
      eq(pick(RX.items[1], ['itemType', 'caseName', 'reporter', 'reporterVolume', 'firstPage', 'court', 'dateDecided', 'docketNumber', 'url']), { itemType: 'case', caseName: 'Fletcher v. Experian Info. Sols., Inc.', reporter: 'F.4th', reporterVolume: '168', firstPage: '231', court: '5th Cir.', dateDecided: 'February 18, 2026', docketNumber: 'No. 25-20086', url: undefined }, 'real Lexis case item');
    }
    if (lusc) {
      eq(RX.T.detectWeb(lusc, u), 'statute', 'real Lexis USC detect'); await RX.T.doWeb(lusc, u);
      eq(pick(RX.items[2], ['code', 'codeNumber', 'section']), { code: 'U.S.C.', codeNumber: '15', section: '1127' }, 'real Lexis USC item');
    }
    const ll = await rlp('list'); eq(RX.T.detectWeb(ll, 'https://plus.lexis.com/search/?pdmfid=1'), 'multiple', 'real Lexis results detect');
    await RX.T.doWeb(ll, 'https://plus.lexis.com/search/?pdmfid=1'); real += '; Lexis statute, results (' + RX.picks[0] + ' results)';
    if (RX.picks[0] !== 10) errors.push('real Lexis results: only ' + RX.picks[0]);
  }
  document.getElementById('out').textContent = errors.length ? 'HARNESS FAILED\n' + errors.join('\n') : 'HARNESS OK (' + real + '; ' + w.items.length + ' + ' + x.items.length + ' items)';
})().catch(e => { document.getElementById('out').textContent = 'HARNESS FAILED\nexception: ' + e.stack; });
</script>
